name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          targets=(
            "linux   amd64"
            "linux   arm64"
            "darwin  amd64"
            "darwin  arm64"
            "windows amd64"
          )
          for target in "${targets[@]}"; do
            read -r os arch <<<"$target"
            ext=""
            [ "$os" = "windows" ] && ext=".exe"
            out="dist/tfproof_${os}_${arch}${ext}"
            echo "building $out"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "$out" ./cmd/tfproof
          done

      - name: Checksums
        working-directory: dist
        run: sha256sum tfproof_* > checksums.txt

      # Binds each binary's digest to this workflow run so action.yml can
      # verify provenance before trusting a downloaded release asset.
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: "dist/tfproof_*"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
