name: tfproof
description: Tamper-evident SOC 2 change evidence for Terraform and OpenTofu plans and applies
author: Hanging Rock Consulting
branding:
  icon: shield
  color: green

inputs:
  command:
    description: "capture-plan, verify, capture-apply, report, publish-vanta, or publish-drata"
    required: true
  sink:
    description: "Evidence store, e.g. s3://my-evidence-bucket/tfproof (all commands except publish-*)"
    default: ""
  workdir:
    description: Terraform/OpenTofu root module directory
    default: "."
  binary:
    description: terraform or tofu
    default: terraform
  plan-file:
    description: Binary plan file, relative to workdir
    default: ""
  plan-json:
    description: Pre-rendered `show -json` output, relative to workdir (optional)
    default: ""
  stack:
    description: Name for this root module instance when one workdir is planned several ways (e.g. per var file). Default is the workdir plus the selected workspace.
    default: ""
  exit-code:
    description: "capture-apply: exit code of terraform apply"
    default: ""
  log:
    description: "capture-apply: path to captured apply output"
    default: ""
  upload-log:
    description: "capture-apply: also store the apply log (may contain sensitive output)"
    default: "false"
  pr:
    description: "Pull request number, auto, or none"
    default: auto
  require-same-run:
    description: "verify: fail if no plan was captured earlier in this run"
    default: "false"
  require-pr:
    description: "verify: fail if no plan was captured on the merged pull request"
    default: "false"
  environment:
    description: "Deployment environment name (e.g. production). capture-apply only counts approvals of this environment."
    default: ""
  region:
    description: AWS region of the evidence bucket (default $AWS_REGION)
    default: ""
  github-token:
    description: Token used to read PR reviews and environment approvals
    default: ${{ github.token }}
  report-repo:
    description: "report: owner/repo (default: this repository)"
    default: ${{ github.repository }}
  report-since:
    description: "report: start date YYYY-MM-DD"
    default: ""
  report-until:
    description: "report: end date YYYY-MM-DD (exclusive)"
    default: ""
  report-out-dir:
    description: "report: output directory"
    default: tfproof-evidence
  kms-key-id:
    description: "capture: KMS key (ID, ARN or alias) used to sign each record"
    default: ""
  report-cloudtrail:
    description: "report: S3 location of CloudTrail logs, e.g. s3://trail-bucket/AWSLogs/{account}, to list each apply's AWS API calls"
    default: ""
  report-cloudtrail-regions:
    description: "report: comma-separated regions whose CloudTrail logs to read (default: $AWS_REGION and us-east-1)"
    default: ""
  report-cloudtrail-bucket-region:
    description: "report: region of the CloudTrail bucket (default: region)"
    default: ""
  report-plan-signing-key:
    description: "report: KMS key ARN that must have signed every plan record"
    default: ""
  report-apply-signing-key:
    description: "report: KMS key ARN that must have signed every apply record"
    default: ""
  publish-dir:
    description: "publish: directory containing changes.csv and summary.md"
    default: tfproof-evidence
  vanta-document-id:
    description: "publish-vanta: Vanta document ID to attach the evidence to"
    default: ""
  drata-workspace-id:
    description: "publish-drata: Drata workspace ID"
    default: ""
  drata-evidence-id:
    description: "publish-drata: Drata evidence library item ID"
    default: ""

outputs:
  record-id:
    description: ID of the record written
    value: ${{ steps.run.outputs.record-id }}
  record-key:
    description: Object key of the record written
    value: ${{ steps.run.outputs.record-key }}
  content-sha256:
    description: Content hash of the record written
    value: ${{ steps.run.outputs.content-sha256 }}
  changeset-digest:
    description: Digest of the planned change set
    value: ${{ steps.run.outputs.changeset-digest }}
  has-changes:
    description: Whether the plan changes anything
    value: ${{ steps.run.outputs.has-changes }}
  verified:
    description: "verify: whether the plan matched"
    value: ${{ steps.run.outputs.verified }}

runs:
  using: composite
  steps:
    # Prefer a signed release binary over building from source: it's faster
    # and lets us verify provenance instead of trusting whatever is checked
    # out at github.action_ref. Only tags (or commit SHAs that resolve to a
    # tag) have a matching release; branches like "main" fall through to the
    # build-from-source steps below. All inputs reach the script only through
    # env:, never by interpolating them into the script, so untrusted values
    # can't inject shell commands.
    - name: Fetch released binary
      id: fetch
      if: env.TFPROOF_BIN == ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ACTION_REF: ${{ github.action_ref }}
        ACTION_REPO: ${{ github.action_repository }}
      run: |
        set -euo pipefail

        if [ -z "$ACTION_REPO" ]; then
          # Local action (uses: ./), not fetched from a versioned repo.
          echo "found=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        repo="$ACTION_REPO"

        # Resolve the ref the caller pinned to a release tag: either the ref
        # is itself a tag with a release, or it's the commit SHA of one.
        tag=""
        if gh release view "$ACTION_REF" --repo "$repo" >/dev/null 2>&1; then
          tag="$ACTION_REF"
        elif [[ "$ACTION_REF" =~ ^[0-9a-f]{40}$ ]]; then
          # The regex above guarantees ACTION_REF is plain hex, so it is safe
          # inside the jq filter. Collect all matches, then take the first in
          # bash (piping into head would SIGPIPE gh under pipefail).
          tags=$(gh api "repos/$repo/tags" --paginate --jq ".[] | select(.commit.sha == \"$ACTION_REF\") | .name")
          tag="${tags%%$'\n'*}"
          if [ -n "$tag" ] && ! gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            tag=""
          fi
        fi
        if [ -z "$tag" ]; then
          echo "found=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        case "$RUNNER_OS" in
          Linux)   os=linux ;;
          macOS)   os=darwin ;;
          Windows) os=windows ;;
          *)
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
            ;;
        esac
        case "$RUNNER_ARCH" in
          X64)   arch=amd64 ;;
          ARM64) arch=arm64 ;;
          *)
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
            ;;
        esac
        ext=""
        [ "$os" = "windows" ] && ext=".exe"
        asset="tfproof_${os}_${arch}${ext}"

        dl="$RUNNER_TEMP/tfproof-dl"
        mkdir -p "$dl"
        gh release download "$tag" --repo "$repo" --dir "$dl" --clobber \
          --pattern "$asset" --pattern "checksums.txt"

        checksum_line=$(grep -E "[[:space:]]${asset}\$" "$dl/checksums.txt" || true)
        if [ -z "$checksum_line" ]; then
          echo "::error title=tfproof::no checksum entry for $asset in release $tag" >&2
          exit 1
        fi
        echo "$checksum_line" > "$dl/asset.sha256"
        ( cd "$dl"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c asset.sha256
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 -c asset.sha256
          else
            echo "::error title=tfproof::no sha256 checksum tool available" >&2
            exit 1
          fi
        )

        gh attestation verify "$dl/$asset" --repo "$repo" \
          --signer-workflow "$repo/.github/workflows/release.yml"

        bin="$RUNNER_TEMP/tfproof${ext}"
        cp "$dl/$asset" "$bin"
        chmod +x "$bin"
        echo "TFPROOF_BIN=$bin" >> "$GITHUB_ENV"
        echo "found=true" >> "$GITHUB_OUTPUT"

    - name: Set up Go
      if: env.TFPROOF_BIN == '' && steps.fetch.outputs.found != 'true'
      uses: actions/setup-go@v5
      with:
        go-version-file: ${{ github.action_path }}/go.mod
        cache: false

    - name: Build tfproof
      if: env.TFPROOF_BIN == '' && steps.fetch.outputs.found != 'true'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail
        bin="$RUNNER_TEMP/tfproof"
        (cd "$ACTION_PATH" && CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=${ACTION_REF:-dev}" -o "$bin" ./cmd/tfproof)
        echo "TFPROOF_BIN=$bin" >> "$GITHUB_ENV"

    # All inputs reach the binary as environment variables, never by
    # interpolating them into the script, so untrusted values (branch names,
    # PR titles) can't inject shell commands.
    - name: Run tfproof
      id: run
      shell: bash
      env:
        CMD: ${{ inputs.command }}
        TFPROOF_SINK: ${{ inputs.sink }}
        TFPROOF_WORKDIR: ${{ inputs.workdir }}
        TFPROOF_BINARY: ${{ inputs.binary }}
        TFPROOF_PLAN_FILE: ${{ inputs.plan-file }}
        TFPROOF_PLAN_JSON: ${{ inputs.plan-json }}
        TFPROOF_STACK: ${{ inputs.stack }}
        TFPROOF_EXIT_CODE: ${{ inputs.exit-code }}
        TFPROOF_LOG: ${{ inputs.log }}
        TFPROOF_UPLOAD_LOG: ${{ inputs.upload-log }}
        TFPROOF_PR: ${{ inputs.pr }}
        TFPROOF_REQUIRE_SAME_RUN: ${{ inputs.require-same-run }}
        TFPROOF_REQUIRE_PR: ${{ inputs.require-pr }}
        TFPROOF_ENVIRONMENT: ${{ inputs.environment }}
        TFPROOF_REGION: ${{ inputs.region }}
        TFPROOF_GITHUB_TOKEN: ${{ inputs.github-token }}
        TFPROOF_REPO: ${{ inputs.report-repo }}
        TFPROOF_SINCE: ${{ inputs.report-since }}
        TFPROOF_UNTIL: ${{ inputs.report-until }}
        TFPROOF_OUT_DIR: ${{ inputs.report-out-dir }}
        TFPROOF_KMS_KEY_ID: ${{ inputs.kms-key-id }}
        TFPROOF_CLOUDTRAIL: ${{ inputs.report-cloudtrail }}
        TFPROOF_CLOUDTRAIL_REGIONS: ${{ inputs.report-cloudtrail-regions }}
        TFPROOF_CLOUDTRAIL_BUCKET_REGION: ${{ inputs.report-cloudtrail-bucket-region }}
        TFPROOF_PLAN_SIGNING_KEY: ${{ inputs.report-plan-signing-key }}
        TFPROOF_APPLY_SIGNING_KEY: ${{ inputs.report-apply-signing-key }}
        TFPROOF_DIR: ${{ inputs.publish-dir }}
        TFPROOF_VANTA_DOCUMENT_ID: ${{ inputs.vanta-document-id }}
        TFPROOF_DRATA_WORKSPACE_ID: ${{ inputs.drata-workspace-id }}
        TFPROOF_DRATA_EVIDENCE_ID: ${{ inputs.drata-evidence-id }}
      run: |
        set -euo pipefail
        case "$CMD" in
          capture-plan)   exec "$TFPROOF_BIN" capture plan ;;
          capture-apply)  exec "$TFPROOF_BIN" capture apply ;;
          verify)         exec "$TFPROOF_BIN" verify ;;
          report)         exec "$TFPROOF_BIN" report ;;
          publish-vanta)  exec "$TFPROOF_BIN" publish vanta ;;
          publish-drata)  exec "$TFPROOF_BIN" publish drata ;;
          *) echo "::error title=tfproof::unknown command '$CMD' (want capture-plan, verify, capture-apply, report, publish-vanta, publish-drata)"; exit 1 ;;
        esac
