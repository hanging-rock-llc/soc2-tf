# Example: tfproof on GitLab CI. Plan on merge requests, then plan -> verify
# -> apply on the default branch, recording evidence at every step.
#
# Prereqs:
#   - an evidence bucket (see terraform/modules/evidence-bucket)
#   - AWS roles trusted via GitLab OIDC (id_tokens): a plan role
#     (plan_writer_policy_json) and an apply role (apply_writer_policy_json)
#     whose trust policy only allows the protected "production" environment
#   - a project access token with read_api (Reporter) stored as the masked
#     CI/CD variable TFPROOF_GITLAB_TOKEN; CI_JOB_TOKEN can't read approvals
#   - merge request approval rules, ideally "Remove all approvals when commits
#     are added" and "Prevent approvals by users who add commits" (Premium)
#   - "Pipelines must succeed" and fast-forward or merged-results pipelines,
#     so the plan on the default branch matches the plan reviewed on the MR

variables:
  TF_ROOT: infra/prod
  AWS_REGION: us-east-1
  TFPROOF_SINK: s3://acme-tf-evidence/tfproof
  TFPROOF_WORKDIR: infra/prod
  TFPROOF_VERSION: v0.2.0   # a tfproof release tag
  PLAN_ROLE: arn:aws:iam::123456789012:role/gitlab-terraform-plan
  APPLY_ROLE: arn:aws:iam::123456789012:role/gitlab-terraform-apply

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages: [plan, apply]

default:
  image:
    name: hashicorp/terraform:1.10
    entrypoint: [""]
  id_tokens:
    AWS_OIDC_TOKEN:
      aud: sts.amazonaws.com
  before_script:
    - apk add --no-cache aws-cli curl
    # Download the release binary and check it against the release checksums.
    - curl -fsSLo /usr/local/bin/tfproof "https://github.com/hanging-rock-llc/soc2-tf/releases/download/${TFPROOF_VERSION}/tfproof_linux_amd64"
    - curl -fsSLo /tmp/checksums.txt "https://github.com/hanging-rock-llc/soc2-tf/releases/download/${TFPROOF_VERSION}/checksums.txt"
    - (cd /usr/local/bin && grep ' tfproof_linux_amd64$' /tmp/checksums.txt | sed 's/tfproof_linux_amd64$/tfproof/' | sha256sum -c -)
    - chmod +x /usr/local/bin/tfproof
    # Session name ties every CloudTrail event to this pipeline job.
    - >
      export $(aws sts assume-role-with-web-identity
      --role-arn "$ROLE_ARN" --role-session-name "gl-${CI_PIPELINE_ID}-${CI_JOB_ID}"
      --web-identity-token "$AWS_OIDC_TOKEN" --duration-seconds 3600
      --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text
      | awk '{print "AWS_ACCESS_KEY_ID="$1" AWS_SECRET_ACCESS_KEY="$2" AWS_SESSION_TOKEN="$3}')

plan:
  stage: plan
  variables:
    ROLE_ARN: $PLAN_ROLE
    TFPROOF_KMS_KEY_ID: arn:aws:kms:us-east-1:123456789012:key/plan-key-id
  script:
    - cd "$TF_ROOT"
    - terraform init -input=false
    - terraform plan -input=false -out=tfplan
    - cd "$CI_PROJECT_DIR"
    - tfproof capture plan --plan-file tfplan
  artifacts:
    paths: [infra/prod/tfplan]
    expire_in: 5 days

apply:
  stage: apply
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment: production   # protected; deployment approvals (Premium) are recorded
  needs: [plan]
  variables:
    ROLE_ARN: $APPLY_ROLE
    TFPROOF_KMS_KEY_ID: arn:aws:kms:us-east-1:123456789012:key/apply-key-id
  script:
    - cd "$TF_ROOT" && terraform init -input=false && cd "$CI_PROJECT_DIR"
    - tfproof verify --plan-file tfplan --require-same-run --require-pr
    # POSIX sh (the image is Alpine): keep the exit code without failing the
    # job before capture apply runs.
    - code=0; (cd "$TF_ROOT" && terraform apply -input=false -no-color tfplan) > apply.log 2>&1 || code=$?; cat apply.log
    - tfproof capture apply --plan-file tfplan --exit-code "$code" --log apply.log
    - exit "$code"
